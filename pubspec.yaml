name: safespend
description: Monthly finance manager that shows one daily safe-to-spend number.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  speech_to_text: ^7.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  record: ^6.0.0
  image: ^4.2.0
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#00040F"
  adaptive_icon_foreground: assets/logo/adaptive_foreground.png
  web:
    generate: true
    image_path: assets/logo/app_icon_rounded.png
    background_color: "#00040F"
    theme_color: "#00040F"
  windows:
    generate: true
    image_path: assets/logo/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/logo/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo_mark.png
    - assets/logo/logo_badge.png
